<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RJ Academy | Premium Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>.hidden { display: none !important; }</style>
    <link rel="stylesheet" href="test.css?v=16.0">
</head>
<body>

    <!-- LOCKED SCREEN -->
    <div id="locked-screen" class="locked-container hidden">
        <div class="locked-card glass-panel">
            <div class="locked-icon" id="locked-icon">🛡️</div>
            <h1 id="locked-title">SYSTEM LOCKED</h1>
            <p id="locked-message">Please contact the administrator.</p>
            <div class="locked-actions">
                <button class="dashboard-btn" onclick="location.href='../index.html'">← DASHBOARD</button>
                <button class="retry-btn" onclick="location.reload()">REFRESH</button>
            </div>
        </div>
    </div>

    <!-- MAIN EXAM APP -->
    <div id="exam-app" class="hidden">
        
        <header class="exam-header glass-panel">
            <div class="brand-logo">
                <span class="logo-text">RJ_ACADEMY</span>
                <span class="pro-badge">PRO</span>
            </div>
            
            <div class="timer-box glow-effect">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
                <span id="exam-timer">00:00:00</span>
            </div>

            <div class="candidate-badge">
                <div class="avatar">
                    <svg width="16" height="16" fill="#fff" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <span id="student-display-name">CANDIDATE</span>
            </div>
        </header>

        <main class="exam-layout">
            
            <!-- MOVEABLE 3D FLOATING ICON (Draggable on Touch) -->
            <div id="draggable-fab" class="matrix-fab">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="2" fill="rgba(0,0,0,0.15)"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="2" fill="rgba(0,0,0,0.15)"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="2" fill="rgba(0,0,0,0.15)"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="2" fill="rgba(0,0,0,0.15)"></rect>
                </svg>
            </div>

            <!-- QUESTION AREA -->
            <section class="question-section glass-panel">
                <div class="question-header">
                    <span id="question-number" class="q-num">QUESTION -- OF --</span>
                    <span id="question-type-badge" class="q-type">MCQ</span>
                </div>
                
                <div class="question-content">
                    <h2 id="question-text">Initializing parameters...</h2>
                </div>

                <div id="options-container" class="options-grid">
                    <!-- Options injected via JS -->
                </div>

                <!-- DESKTOP FOOTER -->
                <div class="action-footer desktop-footer">
                    <button id="prev-btn" class="nav-btn prev" onclick="prevQuestion()" disabled>← Previous</button>
                    <button class="nav-btn clear" onclick="clearAnswer()">Clear Selection</button>
                    <button id="next-btn" class="nav-btn next" onclick="nextQuestion()">Next →</button>
                </div>
            </section>

            <!-- MATRIX & SUBMIT SIDEBAR / POPUP -->
            <aside class="sidebar-section">
                <div class="matrix-card glass-panel">
                    <div class="matrix-handle"></div>
                    <h3 class="matrix-title">QUESTION MATRIX</h3>
                    
                    <div class="matrix-legend">
                        <div class="legend-item"><span class="dot answered"></span> Answered</div>
                        <div class="legend-item"><span class="dot current"></span> Current</div>
                        <div class="legend-item"><span class="dot unanswered"></span> Unanswered</div>
                    </div>

                    <div id="palette-grid" class="palette-grid"></div>

                    <!-- SUBMIT BUTTON -->
                    <button class="submit-exam-btn" onclick="confirmSubmission()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"></path></svg>
                        SUBMIT ASSESSMENT
                    </button>

                    <!-- CLOSE MATRIX -->
                    <button class="close-matrix-btn" onclick="toggleMatrix()">✕ Close Matrix</button>
                </div>
            </aside>
        </main>
        
        <!-- MOBILE STICKY FOOTER -->
        <div class="mobile-sticky-footer">
            <button id="mob-prev-btn" class="nav-btn prev" onclick="prevQuestion()" disabled>← Prev</button>
            <button class="nav-btn clear" onclick="clearAnswer()">Clear</button>
            <button id="mob-next-btn" class="nav-btn next" onclick="nextQuestion()">Next →</button>
        </div>
    </div>

    <!-- SUBMIT MODAL -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-card glass-panel">
            <h2>Confirm Submission</h2>
            <p id="submission-summary">You are about to submit the test.</p>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeConfirmModal()">Cancel</button>
                <button class="confirm-btn" onclick="finalSubmitExam()">Yes, Submit</button>
            </div>
        </div>
    </div>

    <script src="test.js?v=16.0"></script>
</body>
</html>
