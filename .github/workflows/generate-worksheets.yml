
name: Generate Worksheet Manifest

on:
  push:
    paths:
      - "Worksheets/**"
      - "worksheets.json"
      - ".github/workflows/generate-worksheets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worksheet-manifest
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate worksheets.json
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import subprocess
          from pathlib import PurePosixPath

          IMAGE_EXTENSIONS = {".jpg", ".jpeg", ".png", ".webp", ".gif"}

          manifest = {
              "competitive": {
                  "English": [],
                  "Math": [],
                  "Hindi": [],
                  "Reasoning": [],
                  "GS": []
              },
              "board": {
                  "9th-class": {
                      "Hindi": [],
                      "English": [],
                      "Math": [],
                      "Science": [],
                      "Geography": []
                  },
                  "10th-class": {
                      "Hindi": [],
                      "English": [],
                      "Math": [],
                      "Science": [],
                      "Geography": []
                  }
              }
          }

          # Preserve existing manifest order.
          try:
              with open("worksheets.json", "r", encoding="utf-8") as f:
                  old_manifest = json.load(f)
              if isinstance(old_manifest, dict):
                  for section in ("competitive", "board"):
                      if isinstance(old_manifest.get(section), dict):
                          manifest[section].update(old_manifest[section])
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")

          groups = {}

          def get_bucket(path):
              parts = PurePosixPath(path).parts

              if len(parts) < 4 or parts[0].lower() != "worksheets":
                  return None

              if PurePosixPath(path).suffix.lower() not in IMAGE_EXTENSIONS:
                  return None

              section = parts[1].lower()

              if section == "competitive" and len(parts) == 4:
                  return ("competitive", parts[2])

              if section == "board" and len(parts) == 5:
                  return ("board", parts[2], parts[3])

              return None

          for path in tracked:
              if not path:
                  continue

              bucket = get_bucket(path)
              if bucket:
                  groups.setdefault(bucket, []).append(path)

          def first_added_time(path):
              result = subprocess.run(
                  ["git", "log", "--follow", "--diff-filter=A",
                   "--format=%ct", "--", path],
                  capture_output=True,
                  text=True
              )
              dates = result.stdout.strip().splitlines()
              return int(dates[-1]) if dates else 0

          for bucket, current_paths in groups.items():

              # Get existing list.
              target = manifest
              for key in bucket:
                  target = target.setdefault(key, {})

              if not isinstance(target, list):
                  target = []
                  parent = manifest
                  for key in bucket[:-1]:
                      parent = parent.setdefault(key, {})
                  parent[bucket[-1]] = target

              current_set = set(current_paths)

              # Keep old images in their original order.
              ordered = []
              seen = set()

              for old_path in target:
                  if old_path in current_set and old_path not in seen:
                      ordered.append(old_path)
                      seen.add(old_path)

              # Add only new images at the bottom.
              new_paths = [
                  path for path in current_paths
                  if path not in seen
              ]

              new_paths.sort(
                  key=lambda path: (first_added_time(path), path.lower())
              )

              ordered.extend(new_paths)

              parent = manifest
              for key in bucket[:-1]:
                  parent = parent.setdefault(key, {})
              parent[bucket[-1]] = ordered

          with open("worksheets.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Worksheet manifest generated successfully.")

          PY

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worksheets.json

          if git diff --cached --quiet; then
            echo "Manifest already up to date."
            exit 0
          fi

          git commit -m "chore: auto-update worksheet manifest"
          git push
