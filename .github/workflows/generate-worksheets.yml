3. JavaScript analysis – script.js

Yeh website ka sabse important part hai.

Maine 56 major named functions identify kiye hain.

A. Login and session system

Functions:

    handleLogin()

    checkExistingSession()

    activateDashboard()

    getStudentName()

    logout()

Current working logic:

    Student name input leta hai.

    Password verify karta hai.

    Student name localStorage mein save karta hai.

    24 hours ka session maintain karta hai.

    Dashboard activate karta hai.

    Logout par session data clear karta hai.

Critical security issue

const VALID_PASSWORDS = ["04783", "padhlo", "4181723"];

Teen passwords browser ke JavaScript source mein visible hain.

Iska matlab:

    Koi bhi source code dekhkar passwords nikal sakta hai.

    Sabhi students ke liye shared passwords hain.

    LocalStorage edit karke session identity badli ja sakti hai.

    Login system ko genuine server-side authentication nahi kaha ja sakta.

Meri recommendation: Authentication Cloudflare Worker ya kisi secure backend par shift karna chahiye. Passwords ko frontend mein kabhi nahi rakhna chahiye.

