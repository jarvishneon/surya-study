
    
  
name: Generate Worksheet Manifest

on:
  push:
    paths:
      - "Worksheets/**"
      - "worksheets.json"
      - ".github/workflows/generate-worksheets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worksheet-manifest
  cancel-in-progress: false

jobs:
  generate:
    # Avoid running again for the bot's own manifest commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate worksheets.json from image folders
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import subprocess
          from pathlib import PurePosixPath

          IMAGE_EXTENSIONS = {".jpg", ".jpeg", ".png", ".webp", ".gif"}
          manifest = {
              "competitive": {
                  "English": [],
                  "Math": [],
                  "Hindi": [],
                  "Reasoning": [],
                  "GS": []
              },
              "board": {
                  "9th-class": {
                      "Hindi": [],
                      "English": [],
                      "Math": [],
                      "Science": [],
                      "Geography": []
                  },
                  "10th-class": {
                      "Hindi": [],
                      "English": [],
                      "Math": [],
                      "Science": [],
                      "Geography": []
                  }
              }
          }

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=True
          ).split("\0")

          def natural_key(value):
              import re
              # Type-tag each part so names beginning with digits and letters
              # can safely be compared (for example, 2.jpg and page-a.jpg).
              return [
                  (0, int(part)) if part.isdigit() else (1, part.lower())
                  for part in re.split(r"(\d+)", value)
              ]

          # Get the add-event time for each tracked worksheet image from Git
          # history. Sorting by this timestamp keeps older uploads first and
          # places images added in newer commits at the bottom of the reader.
          history = subprocess.check_output(
              [
                  "git", "log", "--diff-filter=A", "--format=COMMIT:%ct",
                  "--name-only", "--", "Worksheets"
              ],
              text=True
          )
          added_at = {}
          commit_time = 0
          for line in history.splitlines():
              if line.startswith("COMMIT:"):
                  commit_time = int(line.split(":", 1)[1])
              elif line.strip() and commit_time:
                  # Git returns newest commits first; setdefault preserves the
                  # latest add event if a path was deleted and later re-added.
                  added_at.setdefault(line.strip(), commit_time)

