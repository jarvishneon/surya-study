Mera focus hoga:

    Har function, variable, event listener aur logic.

    HTML structure, IDs, classes aur JavaScript connections.

    CSS design, animations, responsiveness aur mobile compatibility.

    Login system, authentication aur security vulnerabilities.

    Dashboard, study material, PDF library aur worksheets.

    Online test engine, result system aur data handling.

    Backend Worker API ke saath communication.

    Bugs, conflicting code, missing elements aur performance issues.

    Aage website mein naye features add karne par existing functionality break hone ka risk.

Ek important initial observation: JavaScript mein passwords frontend par defined hain. Isliye authentication ko security ke perspective se specially check karna zaroori hai. Sirf login screen ya AES-256 ka label actual security prove nahi karta.
